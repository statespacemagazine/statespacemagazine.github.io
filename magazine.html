<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termly Magazine Editions - Space State</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #fdfbf7; --card-bg: #ffffff; --text-color: #1a1a1a; --accent-color: #B129F5; --border-color: #e2d9ce; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding-top: 70px; }
        nav { position: fixed; top: 0; left: 0; width: 100%; background-color: var(--bg-color); border-bottom: 1px solid var(--border-color); z-index: 1000; display: flex; justify-content: center; padding: 10px 0; }
        .nav-container { width: 100%; max-width: 1200px; display: flex; justify-content: space-around; padding: 0 20px; }
        .tab-btn { text-decoration: none; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600; color: #666; padding: 8px 16px; border-bottom: 2px solid transparent; transition: all 0.2s ease; }
        .tab-btn:hover { color: var(--accent-color); }
        .tab-btn.active { color: var(--text-color); border-bottom: 2px solid var(--accent-color); }
        header { text-align: center; padding: 40px 20px; border-bottom: 2px solid var(--text-color); max-width: 1200px; margin: 0 auto 40px auto; }
        header h1 { font-family: 'Lora', serif; font-size: 3rem; letter-spacing: -1px; margin-bottom: 10px; }
        header p { color: #666; font-size: 1.1rem; }
        .main-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .content-box { background: var(--card-bg); padding: 40px; border: 1px solid var(--border-color); margin-bottom: 40px; }
        h2 { font-family: 'Lora', serif; font-size: 2rem; margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        
        /* Viewport Display Layout */
        .viewer-title { font-family: 'Lora', serif; font-size: 1.4rem; margin-bottom: 15px; color: var(--text-color); scroll-margin-top: 130px; }
        .pdf-frame { width: 100%; height: 750px; border: 1px solid var(--border-color); background: #f4efea; margin-bottom: 40px; }
        .pdf-open-btn { display: none; background: var(--text-color); color: #fff; text-decoration: none; padding: 12px 20px; font-weight: 600; font-size: 0.95rem; margin-bottom: 30px; }
        
        /* Archive Row List Board */
        .magazine-list { margin-top: 20px; }
        .magazine-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px dashed var(--border-color); }
        .magazine-row:last-child { border-bottom: none; }
        .mag-meta { font-size: 0.85rem; font-weight: 600; color: var(--accent-color); }
        .mag-title-link { font-family: 'Lora', serif; font-size: 1.2rem; color: var(--text-color); text-decoration: none; font-weight: bold; }
        .mag-title-link:hover { color: var(--accent-color); text-decoration: underline; }
        
        .action-links a { font-size: 0.9rem; color: #666; text-decoration: none; margin-left: 15px; font-weight: 600; }
        .action-links a:hover { color: var(--accent-color); }

        footer { text-align: center; padding: 40px 0; border-top: 1px solid var(--border-color); margin-top: 40px; font-size: 0.9rem; color: #666; }
        @media (max-width: 768px) {
            body { padding-top: 120px; }
            .nav-container { flex-wrap: wrap; justify-content: center; gap: 5px; }
            .tab-btn { font-size: 0.85rem; padding: 6px 12px; }
            header h1 { font-size: 2.2rem; }
            .content-box { padding: 20px; }
            h2 { font-size: 1.6rem; }
            .pdf-frame { display: none; }
            .pdf-open-btn { display: inline-block; }
            .magazine-row { flex-direction: column; align-items: flex-start; gap: 8px; }
            .action-links a { margin-left: 0; margin-right: 15px; }
            .view-inline { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="tab-btn">Home</a>
            <a href="archive.html" class="tab-btn">All Weekly Articles</a>
            <a href="magazine.html" class="tab-btn active">Termly Magazine</a>
            <a href="schedule.html" class="tab-btn">Schedule</a>
            <a href="about.html" class="tab-btn">About & Contact</a>
        </div>
    </nav>

    <header>
        <h1>Space State</h1>
        <p>Termly publications</p>
    </header>

    <div class="main-container">
        <!-- Interactive Showcase Window Component -->
        <section class="content-box">
            <h2>Current Edition</h2>
            <div class="viewer-title" id="active-title">Loading Latest Issue...</div>
            <iframe id="magazine-viewport" class="pdf-frame" src="" title="Magazine Viewer"></iframe>
            <a id="open-current" class="pdf-open-btn" href="#" target="_blank">Open Current Edition &rarr;</a>
        </section>

        <!-- Chronological Archives List Tab -->
        <section class="content-box">
            <h2>Past Editions Collection</h2>
            <div class="magazine-list" id="archives-board"></div>
        </section>
    </div>

    <footer><p>&copy; 2026 Space state magazine. All rights reserved.</p></footer>

    <script>
        // ======= ADD YOUR MAGAZINE EDITIONS HERE (Chronological Order: Newest at the top) =======
        // how to use this page: put raw files in the magazine subfolder, add file path newest must be on top!
        const magazineData = [
            { date: "2026-10-01", title: "test1", filePath: "magazines/title.pdf" },
            { date: "2026-05-15", title: "test2", filePath: "magazines/title.pdf" },
            { date: "2025-12-10", title: "test3", filePath: "magazines/title.pdf" }
        ];

        function renderMagazines() {
            const listContainer = document.getElementById("archives-board");

            // 1. Automatically load the top item (Newest) into the live interactive screen frame
            if (magazineData.length > 0) showMagazine(0);

            // 2. Clear out and dynamically build our list directory rows
            let listHTML = "";
            magazineData.forEach((mag, index) => {
                listHTML += `
                    <div class="magazine-row">
                        <div>
                            <div class="mag-meta">${formatDateString(mag.date)}</div>
                            <!-- Clicking this triggers our swap mechanism code below -->
                            <a href="javascript:void(0)" class="mag-title-link" onclick="swapMagazine(${index})">${mag.title}</a>
                        </div>
                        <div class="action-links">
                            <a href="javascript:void(0)" class="view-inline" onclick="swapMagazine(${index})">View On Page &darr;</a>
                            <a href="${mag.filePath}" target="_blank">Open Fullscreen &rarr;</a>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = listHTML || '<p style="color:#777; font-style:italic;">No seasonal publications recorded.</p>';
        }

        // Loads one edition into the viewer, the title line and the mobile open button
        function showMagazine(index) {
            const mag = magazineData[index];
            document.getElementById("magazine-viewport").src = mag.filePath;
            document.getElementById("open-current").href = mag.filePath;
            document.getElementById("active-title").innerText = mag.title + ` (${formatDateString(mag.date)})`;
        }

        // Action code runner to seamlessly shift active viewer paths on user input selection
        function swapMagazine(index) {
            // Phones cannot show PDFs inside a frame, so open the file in a new tab instead
            if (window.innerWidth <= 768) {
                window.open(magazineData[index].filePath, '_blank');
                return;
            }
            showMagazine(index);

            // Smoothly snap window frame position to view focus range nicely
            document.getElementById("active-title").scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function formatDateString(dateStr) {
            const parts = dateStr.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            return d.toLocaleDateString('en-GB', { year: 'numeric', month: 'long' });
        }

        // Run rendering sequence layout maps instantly
        renderMagazines();
    </script>

</body>
</html>
